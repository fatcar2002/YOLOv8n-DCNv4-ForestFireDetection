# YOLOv26n-P2-DCNv4 Micro-Fire Detection Architecture
nc: 1

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2  (320x320)
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4  (160x160)
  - [-1, 3, C2f, [128, True]]          # 2       (160x160) - P2 特征来源
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8  (80x80)
  - [-1, 6, C2f, [256, True]]          # 4       (80x80)  - P3 特征来源
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16 (40x40)
  - [-1, 6, DCNv4_2D, [512, True]]     # 6       (40x40)  - P4 特征来源
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32 (20x20)
  - [-1, 3, DCNv4_2D, [1024, True]]    # 8       (20x20)
  - [-1, 1, SPPF, [1024, 5]]           # 9       (20x20)  - P5 特征来源

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10 (20x20 -> 40x40)
  - [[-1, 6], 1, Concat, [1]]                  # 11 Concat Backbone Layer 6 (40x40)
  - [-1, 3, C2f, [512]]                        # 12 (40x40)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13 (40x40 -> 80x80)
  - [[-1, 4], 1, Concat, [1]]                  # 14 Concat Backbone Layer 4 (80x80)
  - [-1, 3, C2f, [256]]                        # 15 (80x80)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16 (80x80 -> 160x160)
  - [[-1, 2], 1, Concat, [1]]                  # 17 Concat Backbone Layer 2 (160x160)
  - [-1, 3, C2f, [128]]                        # 18 (160x160) -> 🎯 P2 极小目标检测头

  - [-1, 1, Conv, [128, 3, 2]]                # 19 (160x160 -> 80x80)
  - [[-1, 15], 1, Concat, [1]]                 # 20 Concat Layer 15 (80x80)
  - [-1, 3, C2f, [256]]                        # 21 -> P3 检测头

  - [-1, 1, Conv, [256, 3, 2]]                # 22 (80x80 -> 40x40)
  - [[-1, 12], 1, Concat, [1]]                 # 23 Concat Layer 12 (40x40)
  - [-1, 3, C2f, [512]]                        # 24 -> P4 检测头

  - [-1, 1, Conv, [512, 3, 2]]                # 25 (40x40 -> 20x20)
  - [[-1, 9], 1, Concat, [1]]                  # 26 Concat Layer 9 (20x20)
  - [-1, 3, C2f, [1024]]                       # 27 -> P5 检测头

  - [[18, 21, 24, 27], 1, Detect, [nc]]        # 28 挂载四头检测器 (P2, P3, P4, P5)