# YOLOv8n-P2-DCNv4-NWD Micro-Target Detection Architecture
nc: 2

# 🎯 保持无 scaling 的标准结构，由官方 .load("yolov8n.pt") 自动完成相交权重继承
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 3, C2f, [128, True]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 6, C2f, [256, True]]          # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 6, DCNv4_2D, [512, True]]     # 6 (引入 DCNv4 增强形变特征提取)
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 3, DCNv4_2D, [1024, True]]    # 8 (引入 DCNv4 增强大感受野表达)
  - [-1, 1, SPPF, [1024, 5]]           # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                # 12 (P4 融合)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]                # 15 (P3 融合)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]                # 18 (P2/4 极小目标检测头)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]                # 21 (P3/8 小目标检测头)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]                # 24 (P4/16 中目标检测头)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]               # 27 (P5/32 大目标检测头)

  - [[18, 21, 24, 27], 1, Detect, [nc]]  # 四头联合输出 (P2, P3, P4, P5)